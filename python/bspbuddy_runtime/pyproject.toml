[project]
name = "bspbuddy-runtime"
version = "0.1.0"
description = "BspBuddy 本地 Agent 运行时 — Python Sidecar with ReAct Loop"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
