<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BspBuddy</title>
</head>
<body>
  <div id="root"><p style="color:green;font:bold 18px sans-serif">HTML loaded OK. Waiting for React...</p></div>
  <script>
    // Visible before any module loads
    window.addEventListener('error', function(e) {
      document.getElementById('root').innerHTML += '<p style="color:red;font:14px monospace;background:#fee;padding:8px">ERROR: ' + e.message + '</p>';
    });
  </script>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
